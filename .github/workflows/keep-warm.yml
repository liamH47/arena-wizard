name: Keep warm

# Render's free instance sleeps after 15 idle minutes, and waking costs 30 to 60 seconds:
# a blank tab mid-event. During an event window the owner sets the repository variable
# KEEP_WARM=true and this pings every five minutes. Off by default, so off-event months
# stay well inside the 750 free instance hours (decision 0008).
#
# It pings /healthz, which opens no database session, so Neon's compute keeps sleeping
# and its free CU-hours are not spent. Milestone 4 repoints this at /api/refresh, which
# doubles as the nightly refresh trigger.
#
# A failed ping never fails the job. Scheduled runs attach their checks to main's newest
# commit, and render.yaml deploys only when every check on a commit passes, so a failed
# ping during an outage would block the very hotfix that ends it. Alerts come from an
# external uptime monitor instead (docs/runbooks/deploy.md); the outcome is still written
# to the run's summary and raised as a warning here.
# GitHub disables scheduled workflows after 60 days without repository activity; re-enable
# it from the Actions tab (DEBUGGING.md).
on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping /healthz
    if: github.event_name == 'workflow_dispatch' || vars.KEEP_WARM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the app
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Set the repository variable APP_URL (docs/runbooks/deploy.md)"
            echo "Keep-warm skipped: APP_URL is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A sleeping instance also waits for the database and migrates before /healthz
          # answers, so allow 90 s and retry twice before calling it down.
          if curl -fsS --retry 2 --retry-all-errors --max-time 90 "$APP_URL/healthz"; then
            echo "Keep-warm ping: $APP_URL/healthz answered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Keep-warm ping failed: $APP_URL/healthz did not answer"
            echo "Keep-warm ping FAILED: $APP_URL/healthz did not answer." >> "$GITHUB_STEP_SUMMARY"
          fi
