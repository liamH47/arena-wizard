name: CI

# Runs on every pull request and on pushes to main. Render deploys only after every check
# on a commit passes (autoDeployTrigger: checksPass, added with the deploy milestone), so
# these jobs are the deploy gate as well as the review gate.
#
# workflow_dispatch exists for one failure: a push that never produced a run. Render treats
# zero checks as "do not deploy", silently; dispatching against the branch re-runs these
# jobs on its HEAD and un-sticks it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes its in-flight run obsolete. Never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Production runs on Postgres (Neon); tests run on SQLite for speed, and the tests
    # marked `postgres` run here against a real one so dialect differences are caught.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact pins: setup-uv publishes no floating major tag, and the uv version matches
        # the one that wrote uv.lock.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      # The coverage gate lives here and in the verify skill, not in pytest addopts, so a
      # single-file run during development never fails on coverage. The floor-guard job
      # stops the number in coverage_floor.txt from ever going down.
      - name: Test with coverage gate
        run: uv run pytest --cov --cov-fail-under="$(cat coverage_floor.txt)"

      # Required here: a missing database fails these tests instead of skipping them.
      - name: Postgres tests
        env:
          AW_TEST_PG_URL: postgresql+psycopg://arena:arena@localhost:5432/arena
          AW_TEST_PG_REQUIRED: "1"
        run: |
          uv run pytest -m postgres --no-cov
          AW_TEST_DB_URL="$AW_TEST_PG_URL" uv run pytest tests/db tests/api -m "not postgres" --no-cov -q
          ARENA_WIZARD_DATABASE_URL="$AW_TEST_PG_URL" uv run alembic upgrade head
          ARENA_WIZARD_DATABASE_URL="$AW_TEST_PG_URL" uv run alembic check

      # The models and the migrations must describe the same schema, and the migrations
      # must render as plain SQL for review.
      - name: Migrations match the models
        env:
          ARENA_WIZARD_DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic upgrade head --sql > /dev/null

  floor-guard:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard compares against origin/main, so it needs the full history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv python install && uv sync --frozen

      - name: Refuse a lower floor, new pragmas, or new exclusions
        working-directory: backend
        env:
          # Compare with the branch this PR targets; pushes to main compare with main.
          FLOOR_GUARD_BASE: origin/${{ github.base_ref || 'main' }}
        run: uv run python -m arena_wizard.devtools.floor_guard

  eval:
    name: Evaluation gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate compares with the target branch's committed report, never with a file
          # this pull request can rewrite, so it needs that branch's history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv python install && uv sync --frozen

      # Offline: the pinned samples and pre-split aggregates are committed, so CI never
      # downloads from 17Lands. Fails when report.json or report.md is stale, or when the
      # gate in decision 0006 fails against the base report. No paths filter: a config edit
      # is exactly what must be measured.
      - name: Regenerate the report and apply the gate
        run: uv run arena-wizard eval run --check --base origin/${{ github.base_ref || 'main' }}

  frontend:
    name: Frontend (tsc, oxlint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-e2e:
    name: E2E (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No other job builds the image, so nothing else would notice a Dockerfile that
      # serves 404s: /healthz is an API route that never touches the frontend.
      - name: Build the production image
        run: docker build -t arena-wizard:ci .

      # Fail closed (decision 0008): on Render (RENDER=true) the app must refuse to boot
      # without ARENA_WIZARD_ENV=prod. This must exit non-zero.
      - name: The image refuses to boot on Render without production settings
        run: |
          if docker run --rm -e RENDER=true arena-wizard:ci \
              python -c "from arena_wizard.config import Settings; Settings()" \
              > refusal.txt 2>&1; then
            echo "::error::Settings booted on Render without ARENA_WIZARD_ENV=prod"
            exit 1
          fi
          # Refused for the right reason, not by an unrelated import error.
          grep -q "ARENA_WIZARD_ENV=prod" refusal.txt || { cat refusal.txt; exit 1; }

      # Auth off and SQLite are allowed only in dev; the database lands in the data dir.
      - name: Start the container
        run: >
          docker run -d --name arena-wizard-ci -p 8000:8000
          -e ARENA_WIZARD_ENV=dev -e ARENA_WIZARD_AUTH=off -e ARENA_WIZARD_DATA_DIR=/tmp
          arena-wizard:ci

      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "Container healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container never became healthy"
          docker logs arena-wizard-ci
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8000

      # Traces and screenshots are the only way to diagnose a CI-only failure.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: docker logs arena-wizard-ci
